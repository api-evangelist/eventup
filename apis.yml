aid: eventup
name: Eventup
description: >-
  EventUp is a global online marketplace and directory for event venues,
  operated by Tripleseat. It lists over 15,000 restaurants, hotels, breweries,
  rooftop bars, museums, libraries, and other unique spaces that people can
  browse and request quotes from for parties, weddings, corporate events, and
  meetings. Event planners and consumers search venues by city, capacity, event
  type, and amenities and submit free quote requests directly to venue owners,
  while venue owners list and market their spaces to receive booking inquiries.
  A companion product, EventUp Planner, adds marketing, planning, and analytics
  tooling. EventUp is a consumer-facing web marketplace and does not publish a
  public developer API, OpenAPI specification, SDKs, or agent/MCP surface. This
  API Evangelist profile was seeded as a 500 Global portfolio lead and enriched
  with the discoverability, identity, and domain-security signals that are
  publicly observable.
